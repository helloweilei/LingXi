server:
  port: 8080

spring:
  application:
    name: lingxi-backend
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:h2:file:./data/lingxi;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 表结构由 Flyway 管理（db/migration），Hibernate 不再自动改表
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # 已有库（Hibernate 历史建表）自动基线到 V1，新库直接跑全量迁移
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

lingxi:
  jwt:
    # HS256 密钥：优先取环境变量 LINGXI_JWT_SECRET；生产环境（prod profile）使用默认值将拒绝启动
    secret: ${LINGXI_JWT_SECRET:lingxi-creation-jwt-secret-2026-please-change-me-0123456789abcdef}
    expire-hours: 72
  ai:
    # mock = 内置离线示例引擎（无需 API Key）；openai = 任意 OpenAI 兼容接口（DeepSeek/通义/Kimi 等）
    provider: mock
    base-url: https://api.deepseek.com/v1
    api-key: ""
    model: deepseek-chat
    temperature: 0.8
    connect-timeout-seconds: 15
    read-timeout-seconds: 180
    # 上下文预算（字符，中文约 1 字 ≈ 1 token）：设定/大纲/记忆按优先级打包，超出部分截断
    context-budget-chars: 8000
    # 注入的最近章节摘要条数
    max-recent-summaries: 10
    # 单次生成的最大输出 token：过小会导致长章节被硬截断（写不到收尾）
    max-output-tokens: 8192

logging:
  level:
    com.lingxi: info
