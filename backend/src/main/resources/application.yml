server:
  port: 8080

spring:
  application:
    name: lingxi-backend
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:h2:file:./data/lingxi;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 表结构由 Flyway 管理（db/migration），Hibernate 不再自动改表
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # 已有库（Hibernate 历史建表）自动基线到 V1，新库直接跑全量迁移
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

lingxi:
  jwt:
    # HS256 密钥：优先取环境变量 LINGXI_JWT_SECRET；生产环境（prod profile）使用默认值将拒绝启动
    secret: ${LINGXI_JWT_SECRET:lingxi-creation-jwt-secret-2026-please-change-me-0123456789abcdef}
    expire-hours: 72
  ai:
    # 真实引擎优先：配置 LINGXI_AI_API_KEY（可选 LINGXI_AI_BASE_URL / LINGXI_AI_MODEL / LINGXI_AI_PROVIDER
    # 覆盖以下默认值）即自动启用 OpenAI 兼容真实引擎；未配置 Key 时自动回退内置示例引擎（mock）
    provider: ${LINGXI_AI_PROVIDER:openai}
    base-url: ${LINGXI_AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LINGXI_AI_API_KEY:}
    model: ${LINGXI_AI_MODEL:deepseek-chat}
    temperature: 0.8
    connect-timeout-seconds: 15
    read-timeout-seconds: 180
    # 上下文预算（字符，中文约 1 字 ≈ 1 token）：设定/大纲/记忆按优先级打包，超出部分截断
    context-budget-chars: 8000
    # 注入的最近章节摘要条数
    max-recent-summaries: 10
    # 单次生成的最大输出 token：过小会导致长章节被硬截断（写不到收尾/句子断在半截）。
    # 中文约 1 字 ≈ 1~1.5 token，8192 约等于 5500~6000 字；章节目标字数不能超过这个量。
    max-output-tokens: 16384

logging:
  level:
    com.lingxi: info
